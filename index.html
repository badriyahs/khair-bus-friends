<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>أصدقاء باص الخير</title>
  <meta name="theme-color" content="#1db3f7">
  <link rel="icon" href="img/logo-96.png" type="image/png">
  <link rel="apple-touch-icon" href="img/logo-touch.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-head">
    <div class="wrap head-in">
      <a class="brand" href="index.html"><img src="img/logo-96.png" alt=""><img class="logo-official" src="img/logo-official.png" alt="باص الخير"><span>أصدقاء باص الخير</span></a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <div class="blob">
          <img class="deco deco-stars" src="img/deco/stars-green.png" alt="">
          <h1 class="fun-title"><span class="w1">شنو</span> بتييبون؟</h1>
          <div class="hero-logo">
            <img src="img/logo.png" alt="باص الخير">
            <img class="rays" src="img/deco/rays.png" alt="">
            <!-- the little guy waves out of his window -->
            <svg class="hand" viewBox="0 0 640 640" aria-hidden="true">
              <defs>
                <filter id="crayon"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
              </defs>
              <g class="wave-hand" filter="url(#crayon)" fill="none" stroke="#4fa775" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M302 184C318 168 328 150 330 128"/>
                <circle cx="334" cy="112" r="13"/>
                <path d="M324 101l-5-12M334 98V85M344 101l6-11M347 117l10-6"/>
              </g>
            </svg>
          </div>
        </div>
      </div>
    </section>

    <section class="section wrap">
      <ul class="posts" id="openList"></ul>
      <div id="pastWrap" hidden>
        <h2 class="mt-lg">مبادرات سابقة</h2>
        <ul class="posts past" id="pastList"></ul>
      </div>
    </section>
  </main>

  <footer class="site-foot">
    <div class="wrap foot-in"><img class="foot-hug" src="img/deco/hug-hands.png" alt=""><a href="admin.html">الفريق</a></div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
