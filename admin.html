<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>لوحة الفريق · أصدقاء باص الخير</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#eff4fc">
  <link rel="icon" href="img/logo-96.png" type="image/png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-head">
    <div class="wrap head-in" style="max-width:1200px">
      <a class="brand" href="index.html"><img src="img/logo-96.png" alt=""><img class="logo-official" src="img/logo-official.png" alt="باص الخير"><span>أصدقاء باص الخير</span><span class="team-pill">الفريق</span></a>
      <div class="head-nav">
        <span class="who" id="who"></span>
        <button class="btn btn-ghost btn-sm" id="signOut" type="button" hidden>خروج</button>
      </div>
    </div>
  </header>

  <main>
    <p class="muted" id="boot" style="text-align:center;margin-top:64px">جارٍ التحميل…</p>

    <section class="login" id="loginView" hidden>
      <h2>دخول الفريق</h2>
      <form id="loginForm">
        <div class="field"><label for="email">البريد الإلكتروني</label><input class="input" id="email" type="email" dir="ltr" autocomplete="username" required></div>
        <div class="field"><label for="password">كلمة المرور</label><input class="input" id="password" type="password" dir="ltr" autocomplete="current-password" required></div>
        <p class="form-error" id="loginErr" role="alert" hidden></p>
        <button class="btn btn-primary" type="submit" id="loginBtn">دخول</button>
        <button class="btn-link" type="button" id="forgot">نسيت كلمة المرور؟</button>
      </form>
    </section>

    <section class="login" id="notAdminView" hidden>
      <h2>الحساب غير مضاف للفريق</h2>
      <p class="muted">أضف هذا المعرّف إلى <b dir="ltr">admins</b> في Firebase:</p>
      <code id="uid" dir="ltr"></code>
      <button class="btn btn-ghost" type="button" id="signOut2">خروج</button>
    </section>

    <div class="admin-shell" id="dashView" hidden>
      <aside class="side">
        <button class="btn btn-primary" id="newBtn" type="button">+ مبادرة جديدة</button>
        <ul class="ini-list" id="iniList"></ul>
        <button class="btn-link small" id="resetPreview" type="button" hidden>إرجاع البيانات التجريبية</button>
      </aside>
      <section class="panel" id="panel"><p class="muted">جارٍ التحميل…</p></section>
    </div>
  </main>

  <script>window.KBF_ADMIN = true;</script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
