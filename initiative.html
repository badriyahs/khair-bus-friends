<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Khair Bus Friends</title>
  <meta name="theme-color" content="#dcf2e7">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-head">
    <div class="wrap head-in">
      <a class="brand" href="index.html"><img src="img/logo.svg" alt=""><span>Khair Bus Friends</span></a>
    </div>
  </header>

  <main>
    <section class="ini-hero">
      <div class="wrap">
        <h1 id="iniTitle">Loading…</h1>
        <div class="chips" id="iniChips"></div>
      </div>
    </section>

    <section class="section wrap" id="content" hidden>
      <p class="notice" id="closedNote" hidden>Closed</p>
      <ul class="items" id="items"></ul>

      <div class="panel-card extra-card" id="extraCard">
        <h3>Something else</h3>
        <form class="extra-form" id="extraForm" autocomplete="off">
          <input class="input" id="exName" maxlength="80" placeholder="Item" aria-label="Item" required>
          <input class="input" id="exQty" type="number" inputmode="numeric" min="1" value="1" aria-label="How many">
          <button class="btn btn-blue" type="submit">Add</button>
        </form>
        <ul class="tag-list" id="myExtras"></ul>
        <ul class="tag-list" id="others" aria-label="Also coming"></ul>
      </div>
    </section>
  </main>

  <div class="basket" id="basket">
    <form class="basket-in" id="sendForm">
      <input class="input" id="name" autocomplete="name" maxlength="80" placeholder="Your name" aria-label="Your name" required>
      <button class="btn btn-primary" type="submit" id="sendBtn">Confirm</button>
    </form>
  </div>

  <dialog class="sheet" id="thanks" aria-labelledby="thanksTitle">
    <div class="sheet-body thanks">
      <div class="big-check"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2 id="thanksTitle">Thank you!</h2>
      <button class="btn btn-primary" type="button" id="doneBtn">Done</button>
    </div>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/initiative.js"></script>
</body>
</html>
