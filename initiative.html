<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>أصدقاء باص الخير</title>
  <meta name="theme-color" content="#43a86f">
  <link rel="icon" href="img/logo-96.png" type="image/png">
  <link rel="apple-touch-icon" href="img/logo-touch.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="lesson-page brand-bg">
  <!-- like a lesson: close on one side, progress across the top, event name once you scroll -->
  <header class="lesson-bar">
    <div class="head-band">
    <div class="wrap lesson-in">
      <a class="close-btn" href="index.html" aria-label="رجوع"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
      <div class="lesson-mid">
        <b class="sticky-title" id="stickyTitle" hidden></b>
        <div class="bar-ride" id="ride">
          <div class="bar big"><span class="bar-fill" id="ovBar"></span></div>
          <img class="ride-bus" src="img/logo-sticker.png" alt="">
        </div>
      </div>
    </div>
    </div>
    <div class="head-wave" aria-hidden="true"></div>
  </header>

  <main class="wrap lesson">
    <section class="ini-hero">
      <h1 class="fun-title" id="iniTitle">جارٍ التحميل…</h1>
      <div class="info-chips" id="iniInfo"></div>
      <div class="prompt" id="prompt" hidden>
        <img class="prompt-char" id="iniPhoto" alt="">
        <div class="bubble" id="bubble">شنو بتييب؟</div>
      </div>
    </section>

    <div id="content" hidden>
      <p class="notice" id="closedNote" hidden>المبادرة مغلقة</p>
      <ul class="items" id="items"></ul>

      <div class="card extra-card" id="extraCard">
        <h3 class="extra-title"><svg class="crayon-heart" viewBox="0 0 48 44" aria-hidden="true">
            <defs><filter id="heartCrayon"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter></defs>
            <g filter="url(#heartCrayon)" stroke-linecap="round" stroke-linejoin="round">
              <path d="M24 39C14 31 5 24 5 14.5 5 8.5 9.5 4.5 15 4.5c4 0 7 2.5 9 6 2-3.5 5-6 9-6 5.5 0 10 4 10 10C43 24 34 31 24 39z" fill="#d8f3c4" stroke="#4fa775" stroke-width="3"/>
              <path d="M12 12.5c1-2.5 3-3.5 5-3.5" fill="none" stroke="#fff" stroke-width="2.6"/>
            </g>
          </svg>شي زيادة؟</h3>
        <form class="extra-form" id="extraForm" autocomplete="off">
          <input class="input" id="exName" maxlength="80" placeholder="الصنف" aria-label="الصنف" required>
          <input class="input" id="exQty" type="number" inputmode="numeric" min="1" value="1" aria-label="العدد">
          <button class="btn btn-blue" type="submit">أضف</button>
        </form>
        <ul class="tag-list" id="myExtras"></ul>
        <ul class="tag-list" id="others" aria-label="سيحضرها آخرون"></ul>
      </div>

      <section class="board" id="listCard" hidden>
        <div id="whoWrap">
          <h2 class="section-title">اللي مسجل:</h2>
          <div class="peek-wrap">
            <img class="peek" src="img/deco/friend.png" alt="">
            <ol class="rows who-list" id="whoList"></ol>
          </div>
        </div>
        <div>
          <h2 class="section-title">شنو باقي؟</h2>
          <ul class="rows left-list" id="leftList"></ul>
        </div>
      </section>
    </div>
  </main>

  <!-- bottom bar: grey until something is chosen, then green -->
  <footer class="lesson-foot" id="basket">
    <form class="wrap foot-form" id="sendForm">
      <input class="input" id="name" autocomplete="name" maxlength="80" placeholder="اسمك" aria-label="اسمك" required>
      <button class="btn btn-primary" type="submit" id="sendBtn" disabled>تأكيد</button>
    </form>
  </footer>

  <!-- done screen -->
  <section class="complete" id="thanks" hidden aria-live="polite">
    <div class="hero-logo">
      <img src="img/logo-sticker.png" alt="">
      <img class="complete-friend" src="img/deco/friend.png" alt="">
      <img class="rays" src="img/deco/rays-white.png" alt="">
      <svg class="hand" viewBox="0 0 640 472" aria-hidden="true">
        <defs>
          <filter id="crayon"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
        </defs>
        <g class="wave-hand" filter="url(#crayon)" fill="none" stroke="#4fa775" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M302 184C318 168 328 150 330 128"/>
          <circle cx="334" cy="112" r="13"/>
          <path d="M324 101l-5-12M334 98V85M344 101l6-11M347 117l10-6"/>
        </g>
      </svg>
    </div>
    <h2 class="fun-title" id="thanksTitle">شكراً!</h2>
    <div class="stats">
      <div class="stat" style="--c: var(--blue)"><span class="stat-label">أصناف</span><b class="stat-val" id="statKinds">0</b></div>
      <div class="stat" style="--c: var(--green)"><span class="stat-label">قطع</span><b class="stat-val" id="statPieces">0</b></div>
    </div>
    <button class="btn btn-primary btn-wide" type="button" id="doneBtn">متابعة</button>
  </section>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/initiative.js"></script>
</body>
</html>
