<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>أصدقاء باص الخير</title>
  <meta name="theme-color" content="#58cc5a">
  <link rel="icon" href="img/logo-96.png" type="image/png">
  <link rel="apple-touch-icon" href="img/logo-touch.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="brand-bg">
  <!-- white band with their hand-drawn squiggle along the bottom -->
  <header class="site-head">
    <div class="head-band">
      <img class="spark spark-1" src="img/deco/sparkle-w2.png" alt="">
      <img class="spark spark-2" src="img/deco/sparkle-w1.png" alt="">
      <div class="wrap head-in">
        <a class="brand" href="index.html"><img src="img/logo-96-white.png" alt=""><img class="logo-official" src="img/logo-official-white.png" alt="باص الخير"><span class="brand-title fun-title"><span class="w1">أصدقاء</span> باص الخير</span></a>
      </div>
    </div>
    <div class="head-wave" aria-hidden="true"></div>
  </header>

  <main class="wrap">
    <section class="welcome">
      <div class="hero-logo">
        <img src="img/logo-sticker.png" alt="باص الخير">
        <img class="rays" src="img/deco/rays-white.png" alt="">
        <!-- the little guy waves out of his window -->
        <svg class="hand" viewBox="0 0 640 472" aria-hidden="true">
          <defs>
            <filter id="crayon"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
          </defs>
          <g class="wave-hand" filter="url(#crayon)" fill="none" stroke="#4fa775" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M302 184C318 168 328 150 330 128"/>
            <circle cx="334" cy="112" r="13"/>
            <path d="M324 101l-5-12M334 98V85M344 101l6-11M347 117l10-6"/>
          </g>
        </svg>
      </div>
      <h1 class="fun-title"><span class="w1">لنصنع</span> الخير معاً</h1>
    </section>

    <ul class="ev-list" id="openList"></ul>
    <div id="pastWrap" hidden>
      <h2 class="section-title">مبادرات سابقة</h2>
      <ul class="ev-list past" id="pastList"></ul>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
