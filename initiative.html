<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>أصدقاء باص الخير</title>
  <meta name="theme-color" content="#1db3f7">
  <link rel="icon" href="img/logo-96.png" type="image/png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-head">
    <div class="wrap head-in">
      <a class="brand" href="index.html"><img src="img/logo-96.png" alt=""><img class="logo-official" src="img/logo-official.png" alt="باص الخير"><span>أصدقاء باص الخير</span></a>
    </div>
  </header>

  <main>
    <section class="ini-hero">
      <div class="wrap">
        <div class="blob ini-head">
          <img class="ini-photo" id="iniPhoto" alt="" hidden>
          <div class="ini-text">
            <h1 id="iniTitle">جارٍ التحميل…</h1>
            <p class="post-date" id="iniDate" dir="ltr" hidden></p>
            <div class="bar" id="ovBarWrap" hidden><span class="bar-fill" id="ovBar"></span></div>
            <p class="post-left" id="ovLeft"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="section wrap" id="content" hidden>
      <p class="notice" id="closedNote" hidden>المبادرة مغلقة</p>
      <ul class="items" id="items"></ul>

      <div class="panel-card extra-card" id="extraCard">
        <h3>شيء آخر؟</h3>
        <form class="extra-form" id="extraForm" autocomplete="off">
          <input class="input" id="exName" maxlength="80" placeholder="الصنف" aria-label="الصنف" required>
          <input class="input" id="exQty" type="number" inputmode="numeric" min="1" value="1" aria-label="العدد">
          <button class="btn btn-blue" type="submit">أضف</button>
        </form>
        <ul class="tag-list" id="myExtras"></ul>
        <ul class="tag-list" id="others" aria-label="سيحضرها آخرون"></ul>
      </div>
    </section>
  </main>

  <div class="basket" id="basket">
    <form class="basket-in" id="sendForm">
      <input class="input" id="name" autocomplete="name" maxlength="80" placeholder="اسمك" aria-label="اسمك" required>
      <button class="btn btn-primary" type="submit" id="sendBtn">تأكيد</button>
    </form>
  </div>

  <dialog class="sheet" id="thanks" aria-labelledby="thanksTitle">
    <div class="sheet-body thanks">
      <img class="thanks-bus" src="img/logo.png" alt="">
      <h2 id="thanksTitle">شكراً!</h2>
      <button class="btn btn-primary" type="button" id="doneBtn">تم</button>
    </div>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/initiative.js"></script>
</body>
</html>
